# gitleaks config: the default rule set plus Bungie-specific rules.
# Run locally: tools/bin/gitleaks.exe git --staged --config .gitleaks.toml   (the pre-commit hook does this)
[extend]
useDefault = true

[[rules]]
id = "bungie-api-key"
description = "Bungie API key (32 hex characters) next to an API-key name"
regex = '''(?i)(x-api-key|bungie[_-]?api[_-]?key|api[_-]?key)["']?\s*[:=]\s*["']?([0-9a-f]{32})\b'''
secretGroup = 2
keywords = ["api-key", "api_key", "apikey", "bungie"]

[[rules]]
id = "bungie-oauth-client-secret"
description = "Bungie OAuth client secret next to its name (Ghost uses a public client and must never hold one)"
regex = '''(?i)client[_-]?secret["']?\s*[:=]\s*["']?([A-Za-z0-9._-]{20,})'''
secretGroup = 1
keywords = ["client_secret", "client-secret", "clientsecret"]

[[rules]]
id = "bearer-token"
description = "Bearer / access token literal"
regex = '''(?i)(bearer\s+|access_token["']?\s*[:=]\s*["'])([A-Za-z0-9._~+/=-]{24,})'''
secretGroup = 2
keywords = ["bearer", "access_token"]

[allowlist]
description = "Synthetic fixtures and docs"
paths = [
  '''^package-lock\.json$''',
]
