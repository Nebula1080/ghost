<!DOCTYPE html>
<html lang="en" data-theme="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f1c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ghost</title>
<style>
/*__FONTS__*/
:root{
  --bg:#0d0f14;--panel:#151922;--panel2:#1c2130;--line:#2a3142;--text:#e6e8ee;--dim:#8a93a8;--faint:#5b6378;
  --exotic:#ceae33;--legendary:#7b4fb0;--rare:#5076a3;--uncommon:#366e42;--common:#c3bcb4;
  --kinetic:#d9d9d9;--arc:#7aecf3;--solar:#f2721b;--void:#b185df;--stasis:#4d88ff;--strand:#35e366;--prismatic:#ff7ad9;
  --good:#5bd17a;--mid:#e8c547;--bad:#e5624f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.h{font-family:var(--ui);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .brand{font-size:20px;margin-right:6px}
header .brand b{color:var(--exotic)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:nowrap}
.btn:hover{border-color:#47506a}
.btn.primary{background:#2b3a5c;border-color:#3d5285}
.btn.warn{background:#4a3517;border-color:#7a5520}
.btn.small{padding:3px 7px;font-size:12px}
.stat-pill{color:var(--dim);font-size:12px}
.grow{flex:1}
#banner{display:none;padding:8px 14px;background:var(--raise);color:#f0d9a8;border-bottom:1px solid #4a3a1c;font-size:12px}
#panes{flex:1;display:flex;gap:10px;padding:10px;overflow-x:auto;overflow-y:hidden;align-items:stretch}
.pane{flex:0 0 380px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:8px;min-height:0}
.pane.wide{flex-basis:560px}
.pane-head{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pane-head .row{display:flex;gap:6px;align-items:center}
.qin{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:ui-monospace,Menlo,monospace;font-size:12px;outline:none}
.qin:focus{border-color:var(--pc)}
.qin.err{border-color:var(--bad)}
.pane-title{flex:1;background:transparent;border:none;font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.03em;outline:none;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
select.s{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;max-width:130px}
.count{color:var(--dim);font-size:12px;white-space:nowrap}
.pane-body{overflow-y:auto;padding:8px;flex:1;min-height:0}
.group-h{font-family:var(--ui);font-weight:700;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 2px 6px;display:flex;justify-content:space-between}
.group-h:first-child{margin-top:2px}
.card{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:6px;padding:7px 8px 7px 9px;margin-bottom:6px;cursor:pointer}
.card:hover{border-color:#47506a;border-left-color:var(--rc)}
.card .top{display:flex;align-items:center;gap:6px}
.card .nm{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.card .sub{color:var(--dim);font-size:12px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.el{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
.ico{width:15px;height:15px;object-fit:contain;vertical-align:-3px;margin-right:3px;flex:none}
.ico.big{width:20px;height:20px;vertical-align:-2px;margin-right:6px}
.ammo-ico{height:12px;width:auto;vertical-align:-1px;margin-right:3px}
.brk{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:1px solid #3a4258;border-radius:4px;padding:0 4px 0 2px}
.brk .ico{background:#2b3346;border-radius:3px;padding:1px;margin:0}
.crafted{display:inline-block;width:14px;height:14px;vertical-align:-2px;flex:none}
.pk .pi,.bar .pi{width:15px;height:15px;border-radius:3px;vertical-align:-3px;margin:0 4px 0 -3px;background:var(--panel)}
.bar .pi{margin:0 5px 0 0}
details.pinfo{margin:1px 0}
details.pinfo>summary{list-style:none;cursor:pointer}
details.pinfo>summary::-webkit-details-marker{display:none}
details.pinfo>summary .bar:hover{background:var(--raise);border-radius:4px}
.ptext{margin:4px 0 8px 22px;padding:7px 9px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px;white-space:pre-wrap;color:var(--text)}
/* words never break mid-word: wrap only at spaces */
body{overflow-wrap:normal;word-break:normal;hyphens:manual}
.ptext .src{display:block;font-family:var(--ui);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px;color:var(--dim);margin:6px 0 2px}
.ptext .src:first-child{margin-top:0}
.ptext .enh{color:#f1df90}
.has-info{text-decoration:underline dotted var(--faint);text-underline-offset:2px}
/* game-style sockets: round perks, square intrinsics/mods; equipped perks get the blue fill */
.sk-row{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;align-items:flex-start}
.sk-col{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:150px}
.sk-opts{display:flex;gap:2px;padding-left:2px}
.sk{display:flex;align-items:center;gap:5px;cursor:pointer;border-radius:13px;padding:1px 6px 1px 1px;font-size:11.5px;color:var(--text);min-width:0;border:1px solid transparent}
.sk:hover{background:#262d42}
.sk .nm2{white-space:normal;line-height:1.2}
.ic{flex:none;width:24px;height:24px;border-radius:50%;background:var(--panel);border:1px solid #3a4258;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ic img{width:100%;height:100%;display:block}
.spr{display:block;width:100%;height:100%;background-repeat:no-repeat;background-size:4800% auto}
.ic.sq{border-radius:4px}
.ic.sm{width:16px;height:16px}
.ic.lg{width:38px;height:38px}
.ic.xl{width:48px;height:48px}
.ic .ph{font-size:10px;color:var(--faint)}
.sk.sel .ic:not(.sq),.dsk.sel .ic:not(.sq){background:#4a7bb0;border-color:#9cc8ff}
.sk.opt{opacity:.55}
.sk.top .nm2{color:#f1df90}
.sk.enh .ic:not(.sq),.dsk.enh .ic:not(.sq){border-color:#e8c547;box-shadow:inset 0 0 0 1px #e8c54766}
.sk.hit{background:color-mix(in srgb,var(--pc) 30%,transparent);border-color:var(--pc);opacity:1}
.sk-mods{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:1px solid #3a4258;border-radius:4px;padding:0 5px 0 2px;font-size:11.5px}
.chip.art{border-style:dashed;color:var(--dim)}
.chip .ico{background:#2b3346;border-radius:3px;padding:1px;margin:0}
/* drawer socket layout */
.dintr{display:flex;gap:10px;align-items:center;cursor:pointer;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px}
.dintr:hover,.dsk:hover{background:var(--raise)}
.dintr .t{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-family:var(--ui);font-weight:700}
.dcols{display:grid;gap:8px;margin-bottom:8px}
.dcol{display:flex;flex-direction:column;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px;min-width:0}
.dcol .t{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-family:var(--ui);font-weight:700;text-align:center}
.dsk{display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;padding:2px;font-size:12px;min-width:0;border:1px solid transparent}
.dsk .nm2{white-space:normal;line-height:1.2}
.dsk.opt{opacity:.62}
.dsk.on{border-color:var(--pc,#4da3ff);background:var(--raise);opacity:1}
.dsk .pct{margin-left:auto;color:var(--faint);font-size:10.5px}
.dcol .dsk{flex-direction:column;text-align:center;gap:2px;padding:3px 2px}
.dcol .dsk .nm2{white-space:normal;font-size:11px;line-height:1.15}
.dcol .dsk .pct{margin:0}
.dmods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dmods .dsk{flex-direction:column;width:76px;text-align:center;font-size:11px}
.dmods .dsk .nm2{white-space:normal;line-height:1.15}
.dset{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:6px;margin-bottom:8px}
.dset .h2{font-family:var(--ui);font-weight:700;font-size:14px;margin-bottom:4px}
.pdet{border:1px solid var(--pc,#4da3ff);border-radius:8px;background:var(--panel);padding:10px;margin:6px 0 10px}
.pdet .ph2{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pdet .ph2 b{font-family:var(--ui);font-size:18px;display:block;line-height:1.1}
.pdet .kind{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.src2{display:block;font-family:var(--ui);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px;color:var(--dim);margin:8px 0 3px}
.btxt{font-size:12.5px;color:var(--text);white-space:pre-wrap}
.dctx{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:12px;line-height:1.4;color:var(--text)}
.cltx{font-size:12.5px;line-height:1.4;color:var(--text)}
.cltx .cl-sp{height:7px}
.cltx div.cl-pve::before,.cltx div.cl-pvp::before{display:inline-block;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;margin-right:5px;vertical-align:1px}
.cltx div.cl-pve::before{content:'PvE';background:#1f3550;color:#8fc0ff}
.cltx div.cl-pvp::before{content:'PvP';background:#4a2020;color:#ff9a9a}
.cltx span.cl-pve{color:#8fc0ff}.cltx span.cl-pvp{color:#ff9a9a}
.cl-enhancedArrow,.cl-yellow{color:#f1df90}.cl-bold{font-weight:700}.cl-blue{color:#8fb6ff}.cl-green{color:#5bd17a}.cl-purple{color:#b185df}
.cl-arc{color:var(--arc)}.cl-solar{color:var(--solar)}.cl-void{color:var(--void)}.cl-stasis{color:var(--stasis)}.cl-strand{color:var(--strand)}.cl-kinetic{color:var(--kinetic)}
.cl-primary{color:#fff}.cl-special{color:#7af48b}.cl-heavy{color:#b286ff}.cl-barrier{color:#f2b14f}.cl-overload{color:#7aecf3}.cl-unstoppable{color:#e5624f}
.cl-title{text-decoration:underline dotted;cursor:help}
/* subclass viewer */
#subv{display:none;position:fixed;inset:0;z-index:35;background:var(--bg);flex-direction:column}
#subv.open{display:flex}
.sv-head{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.sv-head .h{font-size:20px;margin-right:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
.tab.on{border-color:var(--exotic);background:var(--raise)}
.tab .ic{width:20px;height:20px;border:none;background:transparent}
.sv-els{padding:8px 14px;border-bottom:1px solid var(--line)}
.sv-body{flex:1;display:flex;min-height:0}
.sv-main{flex:1;overflow-y:auto;padding:12px 14px;min-width:0}
.sv-det{width:min(460px,45%);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px;background:var(--panel2)}
.sv-sec{margin-bottom:14px}
.sv-sec .h{font-size:13px;color:var(--dim);margin-bottom:6px}
.sv-grid{display:flex;flex-wrap:wrap;gap:8px}
.sv-tile{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:11.5px;text-align:center;line-height:1.15}
.sv-tile:hover{border-color:#47506a}
.sv-tile.on{border-color:var(--exotic);background:var(--raise)}
.sv-tile .ic{width:48px;height:48px;border-radius:4px;background:var(--well)}
@media (max-width:760px){.sv-body{flex-direction:column}.sv-det{width:auto;border-left:none;border-top:1px solid var(--line);max-height:50%}}
.f{border-radius:4px;padding:0 3px;margin:0 -3px}
.hit{background:color-mix(in srgb,var(--pc) 28%,transparent);outline:1px solid var(--pc);color:#fff}
.perks{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pk{font-size:11.5px;padding:1px 6px;border-radius:10px;background:var(--line);border:1px solid #303850;color:var(--text);white-space:nowrap}
.pk.opt{opacity:.55;border-style:dashed}
.pk.top{border-color:#8a7a2f;color:#f1df90}
.pk .pct{color:var(--faint);margin-left:4px;font-size:10.5px}
.pk.top .pct{color:#b9a75a}
.pk.hit{background:color-mix(in srgb,var(--pc) 35%,var(--line));border-color:var(--pc);color:#fff;opacity:1}
.stats{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:5px;font-size:11.5px;color:var(--dim)}
.stats b{color:var(--text);font-weight:600}
.note{margin-top:5px;font-size:12px;color:var(--dim);background:var(--panel);border-radius:4px;padding:3px 6px;white-space:pre-wrap}
.rate{font-family:var(--ui);font-weight:700;font-size:15px;min-width:30px;text-align:center;border-radius:5px;padding:0 4px;background:var(--panel)}
.tagi{font-size:13px;width:18px;text-align:center}
.pend{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--mid);border:2px solid var(--panel)}
.others{display:flex;gap:3px}
.others i{width:6px;height:6px;border-radius:50%;display:block}
.more{width:100%;margin-top:4px}
.empty{color:var(--dim);padding:20px 8px;text-align:center}
.addpane{flex:0 0 220px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;gap:6px;padding:12px;background:transparent}
.addpane .h{font-size:14px;color:var(--dim);margin-bottom:4px}
.preset{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px}
.preset small{display:block;color:var(--faint);font-family:ui-monospace,monospace;font-size:10.5px;margin-top:2px}
.menu{position:relative}
.menu-list{display:none;position:absolute;right:0;top:110%;background:var(--raise);border:1px solid var(--line);border-radius:6px;z-index:20;min-width:200px;padding:4px;box-shadow:0 8px 24px #0008}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 9px;border-radius:4px}
.menu-list button:hover{background:#262d42}
.menu-list hr{border:none;border-top:1px solid var(--line);margin:4px 0}
/* drawer */
#scrim{display:none;position:fixed;inset:0;background:#0009;z-index:30}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel2);border-left:1px solid var(--line);z-index:31;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
#drawer.open{transform:none}
#scrim.open{display:block}
.d-head{padding:14px 16px;border-bottom:1px solid var(--line);border-left:5px solid var(--rc)}
.d-head .nm{font-family:var(--ui);font-size:24px;font-weight:700;line-height:1.1}
.d-body{padding:14px 16px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--dim)}
.sec{margin-top:16px}
.sec .h{font-size:13px;color:var(--dim);margin-bottom:6px}
.bar{display:grid;grid-template-columns:150px 1fr 92px;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.bar .tr{height:5px;background:var(--line);border-radius:0;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--dim)}
.bar .tr{display:flex}
.bar .tr i.mod{background:var(--accent)}
.bar .num{white-space:nowrap;text-align:right}
.bar .num small{color:var(--faint);font-weight:400}
.stat-legend{display:flex;gap:10px;font-size:11px;color:var(--dim);margin-bottom:4px}
.stat-legend i{display:inline-block;width:10px;height:6px;border-radius:2px;margin-right:4px;vertical-align:1px}
.cfield{display:inline-flex;align-items:center;gap:3px}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.tagbtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
.tagbtn.on{border-color:var(--exotic);background:var(--raise)}
textarea.notes{width:100%;min-height:90px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.d-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
/* modal */
#modal{display:none;position:fixed;inset:0;z-index:40;background:#000a;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal .box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
#modal h2{font-family:var(--ui);margin:0 0 10px;font-size:22px}
#modal code,.help code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.help table{border-collapse:collapse;width:100%;font-size:12.5px}
.help td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top}
.help td:first-child{white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--dim);margin:10px 0}
.drop.over{border-color:var(--exotic);color:var(--text)}
ol.steps li{margin:4px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--line);border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;z-index:50}
.welcome{margin:auto;max-width:620px;text-align:center;color:var(--dim)}
.welcome h1{font-family:var(--ui);color:var(--text);font-size:30px;margin:0 0 8px}

/* ===== theme: flat, squared, grayscale panels with slate→amber page bands (bray.tech-inspired) ===== */
:root{--bg:#18191a;--panel:#1f2021;--panel2:#252627;--line:#323334;--text:#e9e9e9;--dim:#9a9b9c;--faint:#68696a;
  --legendary:#6b4a8a;--exotic:#ceae33;--rare:#5076a3;--uncommon:#366e42;--common:#c3bcb4;--keep:#5bd17a;--trash:#e5624f}
html,body{font:13px/1.45 var(--ui);font-weight:400;background:var(--bg)}
.h{font-family:var(--ui);font-weight:700;letter-spacing:.12em}
header{background:var(--panel2);border-bottom:1px solid var(--raise);padding:0 14px;min-height:46px;gap:14px}
header .brand{font-size:13px;letter-spacing:.14em;display:flex;align-items:center;gap:7px}
header .brand b{color:var(--text)}
header .brand .logo{font-size:16px;color:var(--prof,var(--accent));letter-spacing:0}
.pbtn{display:inline-flex;align-items:center;gap:7px;background:var(--raise);border:1px solid var(--line);color:var(--text);padding:5px 10px;font-size:12.5px;max-width:200px}
.pbtn i{width:9px;height:9px;border-radius:50%;flex:none}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn b{color:var(--dim);font-weight:400}
.pbtn:hover{border-color:var(--line2)}
header{box-shadow:inset 0 -2px 0 var(--prof,transparent)}
.plist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.prow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--raise);padding:8px 10px;cursor:pointer}
.prow:hover{border-color:var(--line2)}
.prow.on{border-color:var(--prof,var(--text));background:var(--raise)}
.prow>i{width:12px;height:12px;border-radius:50%;flex:none}
.prow .pinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.pcur{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.pnew{display:flex;gap:8px}
.pnew .qin{flex:1}

const PROF_COLORS = ['#f0c27b', '#4da3ff', '#5bd17a', '#e05fb7', '#a67cff', '#41d6c3', '#e5624f', '#d8d35a'];
const ppath = (pid, path) => pid === 'main' ? path : `p_${pid}_${path}`;
const pkey = (pid, k) => pid === 'main' ? k : `p:${pid}:${k}`;
const PP = path => ppath(PROF.active, path);
const PK = k => pkey(PROF.active, k);
const activeProfile = () => PROF.list.find(x => x.id === PROF.active) || PROF.list[0];
async function loadRegistry() {
  let reg = LS.get('profiles');
  if (S.db) { try { const r = await dbGet('config/profiles'); if (r?.list?.length) reg = { ...structuredClone(r), active: reg?.active }; } catch {} }
  const okProf = pr => pr && typeof pr === 'object' && /^(main|[a-z0-9]{1,24})$/.test(pr.id);
  const list = Array.isArray(reg?.list) ? reg.list.filter(okProf).map((pr, i) => ({ ...pr, name: String(pr.name ?? 'Profile').slice(0, 60), color: /^#[0-9a-fA-F]{6}$/.test(pr.color) ? pr.color : PROF_COLORS[i % PROF_COLORS.length] })) : [];
  PROF.list = list.length ? list : [{ id: 'main', name: 'My vault', color: PROF_COLORS[0] }];
  let dev = null; try { dev = localStorage.getItem('vs:activeProfile'); } catch {}
  PROF.active = [dev, reg?.active].find(id => id && PROF.list.some(x => x.id === id)) || PROF.list[0].id;
}
async function saveRegistry() {
  const reg = { list: PROF.list, active: PROF.active };
  LS.set('profiles', reg); try { localStorage.setItem('vs:activeProfile', PROF.active); } catch {}
  if (S.db) { try { await dbSet('config/profiles', reg); } catch (e) { console.warn(e); } }
}
// remember counts and a sample of item ids, so freshly loaded CSVs can be matched to the right player
function noteProfileVault() {
  const e = activeProfile(); if (!e || !S.items.length) return;
  const ids = S.items.map(i => i.id); const step = Math.max(1, Math.floor(ids.length / 400));
  Object.assign(e, { weapons: S.weapons.length, armor: S.armor.length, updated: new Date().toISOString(), sample: ids.filter((_, i) => i % step === 0).slice(0, 400) });
  saveRegistry();
}

async function loadAll() {
  try { S.db = await window.claude?.use?.('db'); } catch { S.db = null; }
  try { S.downloads = await window.claude?.use?.('downloads'); } catch { S.downloads = null; }
  if (!S.db && /claude\.ai|claudeusercontent/.test(location.hostname)) banner('Cloud storage isn’t available in this view, so your vault and edits are kept in this browser only. Open the page from claude.ai while signed in to save them and let Claude read them.');
  await loadRegistry();
  if (!S.db) S.ratingsRaw = LS.get('ratings') || {};
  else { try { const ratings = await dbAll('ratings'); S.ratingsRaw = Object.assign({}, ...ratings.map(([, d]) => d.w || {})); } catch {} }
  await loadProfile();
  if (!activeProfile().sample && S.items.length) noteProfileVault();
  renderProfileButton();
}
function resetProfileState() {
  Object.assign(S, { items: [], byId: new Map(), weapons: [], armor: [], edits: {}, panes: [], limits: {}, results: {}, computed: {}, meta: null });
  editQueue.clear();
}
async function loadProfile() {
  resetProfileState(); loadCompareState(); loadCleanState(); loadBuildState(); loadUserRatings();
  if (!S.db) {
    const v = LS.get(PK('vault')); if (v) setVault(v.weapon || [], v.armor || []);
    S.edits = LS.get(PK('edits')) || {}; S.panes = LS.get(PK('panes')) || defaultPanes();
    applyRatings(); renderAll(); return;
  }
  try {
    const [meta, panes, edits] = await Promise.all([
      dbGet(PP('meta/vault')), dbGet(PP('config/panes')), dbAll(PP('edits'))
    ]);
    S.meta = meta;
    S.panes = panes?.list?.length ? panes.list : defaultPanes();
    S.edits = Object.fromEntries(edits.map(([id, d]) => [id, d]));
    if (meta) {
      const chunks = await Promise.all((meta.chunks || []).map(c => dbGet(PP('vault/' + c))));
      const w = [], a = [];
      chunks.forEach(c => (c?.items || []).forEach(it => (it.kind === 'armor' ? a : w).push(it)));
      setVault(w, a, true);
    }
    await loadCleanFromDb(); await loadBuildsFromDb(); await loadUserRatingsFromDb();
    applyRatings(); renderAll();
  } catch (e) {
    console.error(e);
    banner('Couldn’t reach saved data yet (' + (e.message || e.code) + '). You can still load CSVs; reload later to see saved data.');
    if (!S.panes.length) S.panes = defaultPanes();
    renderAll();
  }
}
// finish every pending save for the current profile before switching away from it
async function flushSaves() {
  if (paneSaveT) { clearTimeout(paneSaveT); paneSaveT = null; await writePanes(); }
  if (cleanSaveT) { clearTimeout(cleanSaveT); cleanSaveT = null; await writeClean(); }
  if (bldSaveT) { clearTimeout(bldSaveT); bldSaveT = null; await writeBuilds(); }
  if (urSaveT) { clearTimeout(urSaveT); urSaveT = null; await writeUserRatings(); }
  for (let i = 0; i < 100 && (editBusy || editQueue.size); i++) await new Promise(r => setTimeout(r, 100));
}
async function switchProfile(id) {
  if (id === PROF.active) return;
  await flushSaves();
  closeDrawer(); closeModal();
  PROF.active = id; await saveRegistry();
  await loadProfile();
  renderProfileButton(); setView('vault');
  toast(`Switched to ${activeProfile().name}.`);
}
async function deleteProfileData(pid) {
  for (const k of ['vault', 'edits', 'panes', 'clean', 'compare', 'builds', 'perkRatings']) LS.del(pkey(pid, k));
  if (!S.db) return;
  const del = async path => { try { await S.db.doc(path).delete(); } catch {} };
  try {
    const meta = await dbGet(ppath(pid, 'meta/vault'));
    for (const c of meta?.chunks || []) await del(ppath(pid, 'vault/' + c));
    for (const [id] of await dbAll(ppath(pid, 'edits'))) await del(ppath(pid, 'edits/' + id));
  } catch (e) { console.warn(e); }
  for (const path of ['meta/vault', 'meta/weaponHashes', 'config/panes', 'config/clean', 'config/builds', 'config/perkRatings']) await del(ppath(pid, path));
}

function setVault(weapons, armor, fromDb) {
  const all = [...weapons, ...armor];
  all.forEach(it => {
    if (!fromDb || it.dimTag === undefined) { it.dimTag = it.dimTag ?? it.tag ?? ''; it.dimNotes = it.dimNotes ?? it.notes ?? ''; }
  });
  Core.applyDefs(all, D);
  S.weapons = weapons; S.armor = armor; S.items = all; S.byId = new Map(all.map(i => [i.id, i]));
  refreshEffective();
}
function refreshEffective() { S.items.forEach(it => { it.tag = effTag(it); it.notes = effNotes(it); }); }
// Ghost's own ratings (DIM wish list + Aegis's Endgame Analysis + perk ratings); see the Ratings section below
function applyRatings() { S.items.forEach(it => Core.rateGhost(it, D, RT, UR, RCMAP)); }

async function saveVault() {
  const strip = it => { const o = { ...it }; delete o.breaker; delete o.rating; delete o.pve; delete o.pvp; delete o.perkRel; delete o.why; delete o.tag; delete o.notes; return o; };
  const all = S.items.map(strip);
  if (!S.db) { LS.set(PK('vault'), { weapon: S.weapons.map(strip), armor: S.armor.map(strip) }); return; }
  // pack into chunks under 200KB
  const chunks = []; let cur = []; let size = 0;
  for (const it of all) {
    const s = JSON.stringify(it).length;
    if (cur.length && (cur.length >= CHUNK || size + s > 190000)) { chunks.push(cur); cur = []; size = 0; }
    cur.push(it); size += s;
  }
  if (cur.length) chunks.push(cur);
  const names = chunks.map((_, i) => 'c' + i);
  for (let i = 0; i < chunks.length; i++) await dbSet(PP('vault/' + names[i]), { items: chunks[i] });
  const old = S.meta?.chunks || [];
  for (const o of old) if (!names.includes(o)) { try { await S.db.doc(PP('vault/' + o)).delete(); } catch {} }
  const weaponList = [...new Map(S.weapons.map(w => [w.hash, w.name])).entries()];
  S.meta = { chunks: names, updated: new Date().toISOString(), weapons: S.weapons.length, armor: S.armor.length };
  await dbSet(PP('meta/vault'), S.meta);
  await dbSet(PP('meta/weaponHashes'), { list: weaponList, updated: S.meta.updated });
}
let paneSaveT;
async function writePanes() {
  const list = S.panes.map(({ id, title, q, sort, dir, group, wide }) => ({ id, title, q, sort, dir, group, wide: !!wide }));
  if (!S.db) return LS.set(PK('panes'), list);
  try { await dbSet(PP('config/panes'), { list }); } catch (e) { console.warn(e); }
}
function savePanes() {
  clearTimeout(paneSaveT);
  paneSaveT = setTimeout(() => { paneSaveT = null; writePanes(); }, 800);
}
// queue entries carry their full path and data, so a profile switch can't redirect them
const editQueue = new Map(); let editBusy = false;
async function saveEdit(id) {
  if (!S.db) return LS.set(PK('edits'), S.edits);
  editQueue.set(PP('edits/' + id), S.edits[id] ? { ...S.edits[id] } : null); if (editBusy) return; editBusy = true;
  while (editQueue.size) {
    const [path, data] = editQueue.entries().next().value; editQueue.delete(path);
    try { if (data) await dbSet(path, data); else await S.db.doc(path).delete(); }
    catch (e) { toast('Couldn’t save an edit: ' + (e.message || e.code)); }
  }
  editBusy = false;
}

// ---------- edits ----------
function setItemEdit(it, patch) {
  const cur = { ...(S.edits[it.id] || {}) };
  Object.assign(cur, patch);
  if ('tag' in cur && cur.tag === it.dimTag) delete cur.tag;
  if ('notes' in cur && cur.notes === it.dimNotes) delete cur.notes;
  if ('tag' in cur || 'notes' in cur) { cur.hash = it.hash; cur.name = it.name; S.edits[it.id] = cur; }
  else delete S.edits[it.id];
  it.tag = effTag(it); it.notes = effNotes(it);
  saveEdit(it.id);
}
const pendingIds = () => Object.keys(S.edits).filter(id => S.byId.has(id) && ('tag' in S.edits[id] || 'notes' in S.edits[id]));

// ---------- Bungie sign-in (hosted build only: src/bungie.js + the key/client_id injected at build) ----------
// Never inside claude.ai or a frame (Bungie requires a visible address bar for sign-in).
const BG = (() => {
  const cfg = window.VS_BUNGIE_CFG;
  if (typeof Bungie === 'undefined' || !cfg || /claude\.ai|claudeusercontent/.test(location.hostname) || window.top !== window.self) return null;
  const store = { getItem: k => { try { return sessionStorage.getItem(k); } catch { return null; } }, setItem: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, removeItem: k => { try { sessionStorage.removeItem(k); } catch {} } };
  const b = Bungie.create({ key: cfg.key, client: cfg.client, fetch: (u, o) => fetch(u, o), store, random: n => crypto.getRandomValues(new Uint8Array(n)) });
  return b.available ? b : null;
})();
const bungieOn = () => !!BG && !!window.VS_APIDEFS;
function bungieLoadHtml() {
  const inn = BG.signedIn();
  return `<h2>Load from Bungie</h2>
    <p class="stat-pill">Reads your weapons and armor straight from your Bungie account. Ghost changes items only when you ask it to (equip an item, switch a perk, change a mod or equip a build), and only after you confirm each change. DIM tags and notes still come from DIM's CSVs; drop them below and they merge onto these items.</p>
    <div class="msheet bsign">${inn ? `<button class="btn primary" data-bg="load">Refresh from Bungie</button><button class="btn" data-bg="out">Sign out of Bungie</button>`
      : `<button class="btn primary" data-bg="in">Sign in with Bungie</button>`}</div>`;
}
function bindBungieButtons(root) {
  root.querySelectorAll('[data-bg]').forEach(b => b.onclick = async () => {
    const a = b.dataset.bg;
    if (a === 'in') { try { await flushSaves(); location.assign(BG.authorizeUrl()); } catch (e) { toast(e.message || 'Couldn’t start Bungie sign-in.', 6000); } }
    else if (a === 'load') { closeModal(); loadFromBungie(); }
    else if (a === 'out') { BG.signOut(); closeModal(); renderBungieBtn(); toast('Signed out of Bungie. Your loaded vault stays here.'); }
  });
}
// desktop rail: its own Sign in / Refresh button, so sign-in isn't hidden inside the Load dialog (phones use the ⋯ menu)
function renderBungieBtn() {
  const b = $('#bBungie'); if (!b) return;
  b.hidden = !bungieOn(); if (b.hidden) return;
  const inn = BG.signedIn();
  b.dataset.bg = inn ? 'load' : 'in'; b.textContent = inn ? 'Refresh from Bungie' : 'Sign in with Bungie';
  bindBungieButtons(b.parentElement);
}
async function loadFromBungie(pick) {
  if (!BG?.signedIn()) { toast('Your Bungie sign-in has expired. Sign in again to refresh your vault.', 6000); return; }
  toast('Loading your vault from Bungie…', 20000);
  try {
    let m = pick;
    if (!m) {
      const { list } = await BG.memberships();
      if (!list.length) { toast('No Destiny 2 account found on this Bungie account.', 6000); return; }
      if (list.length > 1) {
        const PLAT = { 1: 'Xbox', 2: 'PlayStation', 3: 'Steam', 4: 'Blizzard', 5: 'Stadia', 6: 'Epic' };
        toast('Pick an account', 1500);
        modal(`<h2>Which Destiny account?</h2><div class="msheet">${list.map((x, i) => `<button class="btn" data-acct="${i}">${esc(x.name)} · ${PLAT[x.type] || 'Platform ' + x.type}</button>`).join('')}<button class="btn" data-close>Cancel</button></div>`);
        $('#modalBox').querySelectorAll('[data-acct]').forEach(b => b.onclick = () => { closeModal(); loadFromBungie(list[+b.dataset.acct]); });
        return;
      }
      m = list[0];
    }
    const resp = await BG.profile(m.type, m.id);
    const { weapons, armor, chars, subs } = Core.apiToItems(resp, window.VS_APIDEFS);
    LS.set(BCTX_KEY, { type: Number(m.type), id: String(m.id), chars, subs });
    if (!weapons.length && !armor.length) { toast('Bungie returned no weapons or armor for this account.', 6000); return; }
    routeParsed([{ kind: 'weapon', items: weapons }, { kind: 'armor', items: armor }], [`From Bungie: ${weapons.length} weapons, ${armor.length} armor`]);
  } catch (e) { toast(e?.message || 'Couldn’t load your vault from Bungie.', 7000); }
}
// back from Bungie's sign-in page: check state, swap the code for a token, clean the address bar, load the vault
async function bungieReturn() {
  if (!BG) return;
  const search = location.search; if (!/[?&](code|state|error)=/.test(search)) return;
  try { history.replaceState(null, '', location.pathname + location.hash); } catch {}
  try { if (await BG.handleCallback(search)) { renderBungieBtn(); toast('Signed in with Bungie.'); await loadFromBungie(); } }
  catch (e) { toast(e?.message || 'Bungie sign-in didn’t complete.', 7000); }
}
$('#file').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };
// Item instance ids are unique to one Bungie account, so the share of ids a CSV has in common with a profile's
// saved sample says whose vault it is.
function profileMatch(ids) {
  const set = new Set(ids); const out = [];
  for (const pr of PROF.list) {
    const sample = pr.id === PROF.active && S.items.length ? S.items.map(i => i.id) : (pr.sample || []);
    if (!sample.length) continue;
    const hit = sample.filter(id => set.has(id)).length;
    out.push({ pr, score: hit / Math.min(sample.length, set.size || 1) });
  }
  return out.sort((a, b) => b.score - a.score);
}
async function handleFiles(files) {
  const parsed = []; const msgs = [];
  for (const f of files) {
    try {
      if (f.size > Core.LIMITS.csvBytes) { msgs.push(`${f.name}: larger than ${Core.LIMITS.csvBytes / 1048576} MB, skipped`); continue; }
      const { kind, items } = Core.parseDimCsv(await f.text());
      items.forEach(it => { it.dimTag = it.tag; it.dimNotes = it.notes; });
      if (kind !== 'weapon' && kind !== 'armor') { msgs.push(`${f.name}: not a weapon or armor export, skipped`); continue; }
      parsed.push({ kind, items }); msgs.push(`${f.name}: ${items.length} ${kind}`);
    } catch (e) { msgs.push(`${f.name}: ${e.message}`); }
  }
  if (!parsed.length) return toast(msgs.join(' · ') || 'Nothing loaded.', 5000);
  // the open vault came from Bungie: DIM's CSVs only add their tags and notes (GHOST_PLAN A6)
  if (S.items.some(i => i.src === 'api')) {
    const score = profileMatch(parsed.flatMap(x => x.items.map(i => i.id))).find(m => m.pr.id === PROF.active)?.score ?? 0;
    if (score >= 0.3) return mergeCsvTags(parsed);
  }
  routeParsed(parsed, msgs);
}
// tags and notes from DIM CSVs onto a vault loaded from Bungie; items stay exactly as Bungie reported them
async function mergeCsvTags(parsed) {
  let n = 0;
  for (const { items } of parsed) for (const c of items) { const it = S.byId.get(c.id); if (!it) continue; it.dimTag = c.tag || ''; it.dimNotes = c.notes || ''; n++; }
  clearSyncedEdits(); refreshEffective(); closeModal(); renderAll();
  toast(`Merged DIM tags and notes onto ${n} items`, 5000);
  try { await saveVault(); } catch (e) { toast('Tags merged but not saved: ' + (e.message || e.code), 6000); }
}
// load parsed items into the right profile: the open one if they match it, otherwise offer to switch or make one
function routeParsed(parsed, msgs) {
  const ids = parsed.flatMap(x => x.items.map(i => i.id));
  const matches = profileMatch(ids);
  const cur = activeProfile(); const curScore = matches.find(m => m.pr.id === cur.id)?.score ?? null;
  const other = matches.find(m => m.pr.id !== cur.id && m.score >= 0.3);
  const go = () => applyParsed(parsed, msgs);
  // matches the open profile, or the open profile is empty and nobody else matches: just load
  if ((curScore != null && curScore >= 0.3) || (!S.items.length && !other)) return go();
  closeModal();
  const curName = esc(cur.name);
  if (other) {
    modal(`<h2>These look like ${esc(other.pr.name)}'s items</h2>
      <p>${Math.round(other.score * 100)}% of the items in these CSVs are in <b>${esc(other.pr.name)}</b>'s saved vault${S.items.length ? `, and they don't match <b>${curName}</b>` : ''}.</p>
      <div class="msheet"><button class="btn primary" id="pmSwitch">Switch to ${esc(other.pr.name)} and load them there</button>
        <button class="btn" id="pmHere">Load into ${curName} anyway</button><button class="btn" data-close>Cancel</button></div>`);
    $('#pmSwitch').onclick = async () => { closeModal(); await switchProfile(other.pr.id); go(); };
    $('#pmHere').onclick = () => { closeModal(); go(); };
    return;
  }
  modal(`<h2>These aren't ${curName}'s items</h2>
    <p>None of the items in these CSVs are in <b>${curName}</b>'s vault, so they're probably from a different Bungie account. Loading them here would replace ${curName}'s vault.</p>
    <label class="stat-pill" for="pmName">New profile name</label><input class="qin" id="pmName" value="Player ${PROF.list.length + 1}" style="width:100%;margin:4px 0 10px">
    <div class="msheet"><button class="btn primary" id="pmNew">Create this profile and load them there</button>
      <button class="btn" id="pmHere">Replace ${curName}'s vault</button><button class="btn" data-close>Cancel</button></div>`);
  $('#pmNew').onclick = async () => { const name = $('#pmName').value.trim() || `Player ${PROF.list.length + 1}`; closeModal(); await createProfile(name); go(); };
  $('#pmHere').onclick = () => { closeModal(); go(); };
}
// drop local edits that now match what DIM has
function clearSyncedEdits() {
  let synced = 0;
  for (const id of Object.keys(S.edits)) {
    const it = S.byId.get(id); if (!it) continue;
    const e = S.edits[id]; let ch = false;
    if ('tag' in e && e.tag === it.dimTag) { delete e.tag; ch = true; }
    if ('notes' in e && e.notes === it.dimNotes) { delete e.notes; ch = true; }
    if (ch) { synced++; if (!('tag' in e) && !('notes' in e)) delete S.edits[id]; saveEdit(id); }
  }
  return synced;
}
async function applyParsed(parsed, msgs) {
  let w = S.weapons, a = S.armor;
  // a Bungie load carries no DIM tags/notes: keep the ones this vault already had (from earlier CSVs) by item id
  const prev = S.byId;
  for (const { items } of parsed) for (const it of items) if (it.src === 'api') { const p = prev.get(it.id); it.dimTag = p?.dimTag ?? ''; it.dimNotes = p?.dimNotes ?? ''; }
  for (const { kind, items } of parsed) { if (kind === 'weapon') w = items; else a = items; }
  setVault(w, a);
  const synced = clearSyncedEdits();
  refreshEffective(); applyRatings(); closeModal(); renderAll();
  toast(msgs.join(' · ') + (synced ? ` · ${synced} edits now synced` : ''), 5000);
  try { await saveVault(); noteProfileVault(); renderProfileButton(); toast(`Saved to ${activeProfile().name}.`); } catch (e) { toast('Vault loaded but not saved: ' + (e.message || e.code), 6000); }
}

// ---------- export ----------
function exportCsv() {
  const ids = pendingIds();
  if (!ids.length) return toast('No tag or note changes to export yet.');
  const rows = ids.map(id => { const it = S.byId.get(id); return { Id: it.id, Hash: it.hash, Name: it.name, Tag: effTag(it) || '', Notes: (effNotes(it) || '').slice(0, NOTE_MAX) }; });
  const csv = Core.toCSV(['Name', 'Hash', 'Id', 'Tag', 'Notes'], rows);
  // every column is formula-guarded (Core.toCSV); DIM's importer keeps the added ', so say which notes get one
  const guarded = rows.filter(r => /^[=+\-@\t\r]/.test(r.Notes));
  const fname = `dim-tags-notes-${new Date().toISOString().slice(0, 10)}.csv`;
  modal(`<h2>Export ${ids.length} change${ids.length > 1 ? 's' : ''} from ${esc(activeProfile().name)} to DIM</h2>

// Phone share sheet (send the CSV or a DIM search to DIM, Files, Messages…) where the browser supports it
function addShareButton(after, payload) {

// Options follow the pane's results: weapon-only keys appear when weapons match, armor-only keys when armor does,

function kindsOf(items) { const w = items.some(i => i.kind === 'weapon'), a = items.some(i => i.kind === 'armor'); return (w || a) ? { w, a } : { w: true, a: true }; }
function sortChoices(items) {
  const { w, a } = kindsOf(items);
  const o = [];
  if (w) o.push(['rating', 'Rating'], ['pve', 'PvE score'], ['pvp', 'PvP score']);
  o.push(['power', 'Power'], ['tier', 'Tier'], ['rarity', 'Rarity'], ['name', 'Name'], ['type', 'Type'], ['frame', w && a ? 'Frame / archetype' : w ? 'Frame' : 'Archetype']);
  if (w) o.push(['element', 'Element'], ['ammo', 'Ammo type'], ['breaker', 'Breaker'], ['crafted', 'Crafted'], ['kills', 'Kills']);
  if (a) o.push(['set', 'Armor set'], ['class', 'Class'], ['total', 'Stat total']);
  o.push(['tag', 'Tag'], ['source', 'Source'], ['season', 'Season']);
  const statNames = new Set(); items.forEach(it => Object.keys(it.stats).forEach(k => statNames.add(k)));
  [...statNames].filter(s => s !== 'Total').sort().forEach(s => o.push(['stat:' + s, 'Stat: ' + s]));
  return o;
}
function groupChoices(items) {
  const { w, a } = kindsOf(items);
  const o = [['', 'No grouping'], ['type', 'Type'], ['frame', w && a ? 'Frame / archetype' : w ? 'Frame' : 'Archetype'], ['rarity', 'Rarity'], ['tier', 'Tier']];
  if (w) o.push(['element', 'Element'], ['ammo', 'Ammo type'], ['breaker', 'Breaker'], ['crafted', 'Crafted']);
  if (a) o.push(['set', 'Armor set'], ['class', 'Class']);
  o.push(['tag', 'Tag'], ['source', 'Source'], ['season', 'Season'], ['name', 'Item name']);

}
function optionsHtml(choices, sel, allLabels) {
  const list = [...choices];
  if (sel && !list.some(([v]) => v === sel)) list.push([sel, (allLabels[sel] || sel.replace(/^stat:/, 'Stat: ')) + ' (not in results)']);
  return list.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`).join('');
}
const SORT_LABELS = Object.fromEntries(sortChoices([]).map(x => x));
const GROUP_LABELS = Object.fromEntries(groupChoices([]).map(x => x));
function sortOptions(sel, items = S.items) { return optionsHtml(sortChoices(items), sel, SORT_LABELS); }
function groupOptions(sel, items = S.items) { return optionsHtml(groupChoices(items), sel, GROUP_LABELS); }

function computePane(p) {
  const parsed = Core.parseQuery(p.q);
  const ctx = Core.buildCtx(S.items, new Set(pendingIds()), D);
  const res = Core.runQuery(parsed, S.items, ctx);
  S.results[p.id] = res;
  const sortKey = parsed.sort || p.sort || 'rating';
  let list = Core.sortItems([...res.keys()].map(id => S.byId.get(id)), sortKey.replace(/^stat\./, 'stat:'), p.dir);
  if (p.group) {
    const groups = new Map();
    list.forEach(it => { const g = Core.groupKey(it, p.group); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(it); });
    let gs = [...groups.entries()];
    if (p.group === 'name') gs = gs.sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
    else if (p.group === 'tier') gs = gs.sort((a, b) => b[0].localeCompare(a[0]));
    else if (p.group === 'ammo' || p.group === 'breaker' || p.group === 'set') gs = gs.sort((a, b) => Core.groupOrder(p.group, a[0]) - Core.groupOrder(p.group, b[0]) || a[0].localeCompare(b[0]));
    else gs = gs.sort((a, b) => a[0].localeCompare(b[0]));
    return { parsed, groups: gs, total: list.length, sortKey };
  }
  return { parsed, groups: [['', list]], total: list.length, sortKey };
}

function bindPane(el, p) {

    if (act === 'dup') { S.panes.splice(i + 1, 0, { ...p, id: uid(), title: p.title + ' (copy)' }); savePanes(); renderPanes(); }

const PAGE = () => isMobile() ? 40 : 150;
function refreshBodies() {
  // compute all first so cards can show membership in other panes
  S.computed = {};
  S.panes.forEach(p => { S.computed[p.id] = computePane(p); });
  document.querySelectorAll('.pane').forEach(el => { const p = S.panes.find(x => x.id === el.dataset.id); if (p) refreshBody(el, p); });
  renderHeader();
  document.querySelectorAll('#paneChips .pchip small').forEach((s, i) => { const p = S.panes[i]; if (p) s.textContent = S.computed[p.id]?.total ?? ''; });
}
function refreshBody(el, p) {
  const c = S.computed[p.id] || computePane(p);
  const qin = el.querySelector('.qin');
  el.querySelector('.count').textContent = `${c.total} item${c.total === 1 ? '' : 's'}`;
  qin.classList.toggle('err', !!p.q.trim() && !c.parsed.groups.length && !c.parsed.sort);
  // refresh the sort / group menus for what this query returns
  const resItems = [...(S.results[p.id]?.keys() || [])].map(id => S.byId.get(id));
  for (const [k, fn] of [['sort', sortOptions], ['group', groupOptions]]) {
    const sel = el.querySelector(`select[data-k=${k}]`); if (!sel || document.activeElement === sel) continue;
    const html = fn(p[k], resItems); if (sel.dataset.h !== html) { sel.innerHTML = html; sel.dataset.h = html; }
  }
  const body = el.querySelector('.pane-body');
  if (!c.total) { body.innerHTML = `<div class="empty"><svg class="sig" viewBox="0 0 48 48" aria-hidden="true"><use href="#g-ghost"/></svg><b>Nothing matches this search</b><span>${S.items.length ? 'Remove a term from the search above, or pick a ready-made sort from the + Add a sort column.' : 'Load your DIM spreadsheets first.'}</span></div>`; return; }
  const limit = S.limits[p.id] || PAGE(); let shown = 0; const out = [];
  const paneIdx = S.panes.indexOf(p);
  for (const [g, list] of c.groups) {
    if (shown >= limit) break;
    if (p.group) out.push(`<div class="group-h"><span>${groupIcon(p.group, g)}${esc(g)}</span><span>${list.length}</span></div>`);
    for (const it of list) { if (shown >= limit) break; out.push(cardHtml(it, S.results[p.id].get(it.id), paneIdx, c.sortKey)); shown++; }
  }
  if (shown < c.total) out.push(`<button class="btn more" data-act="more">Show more (${c.total - shown} left)</button>`);
  body.innerHTML = out.join('');
  // load the next page automatically when the "Show more" button scrolls into view
  const more = body.querySelector('[data-act=more]');
  if (more && 'IntersectionObserver' in window) { const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { io.disconnect(); more.click(); } }, { root: isMobile() ? null : body, rootMargin: '300px' }); io.observe(more); }
}

// Armor 3.0 stat effects at a total (0-200). Numbers from the Destiny Data Compendium (Game Mechanics); below 100 the
// Compendium has no regen numbers for Melee / Grenade / Class / Super, so those show Bungie's own description.
const pct = (x, d = 1) => `${Math.round(x * 10 ** d) / 10 ** d}%`;
const STAT_FX = {
  Weapons: v => [`${pct(0.15 * Math.min(v, 100))} weapon damage vs minor and major combatants, faster reload and handling (0.9× durations at 100)`,
    v > 100 ? `${pct(0.15 * (v - 100))} Primary / Special and ${pct(0.1 * (v - 100))} Power weapon damage vs bosses; ${Math.min(100, v - 100)}% chance for bigger ammo bricks` : ''],
  Health: v => [`+${Math.round(0.7 * Math.min(v, 100))} HP per Orb of Power, ${pct(0.1 * Math.min(v, 100))} flinch resist while aiming`,
    v > 100 ? `+${Math.round(Math.min(v - 100, 100) / 5)} shield HP vs combatants (up to +20, 25% faster recharge start and 50% faster recharge at 200)` : ''],
  Class: v => ['Faster class ability regeneration, more class ability energy from all sources',
    v > 100 ? `Class ability grants a ${Math.round(0.4 * (v - 100))} HP overshield (dodge / thruster 5 s, rift / barricade 10 s); damaging class abilities +${pct(0.65 * (v - 100), 0)}` : ''],
  Grenade: v => ['Faster grenade regeneration, more grenade energy from all sources', v > 100 ? `+${pct(0.65 * (v - 100))} grenade damage` : ''],
  Super: v => ['More Super energy from all sources', v > 100 ? `+${pct(0.45 * (v - 100))} Super damage (Well of Radiance / Ward of Dawn: up to 33% longer at 200)` : ''],
  Melee: v => ['Faster melee regeneration, more melee energy from all sources', v > 100 ? `+${pct(0.3 * (v - 100))} melee damage` : ''],
};
// Clarity Character Stats v2: the tooltip text at a stat value ({{Field}} / {{Field|ScalarPercent}} / unit tokens)
const r1 = x => Math.round(x * 10) / 10;
const fillStatTip = (t, vals, extra = {}) => String(t || '').replace(/\{\{(\w+)(?:\|(\w+))?\}\}/g, (m, k, fmt) => {
  if (k === 'Time') return ' s'; if (k === 'Percent') return '%'; if (k === 'HP') return ' HP'; if (k === 'PercentPerSecond') return '%/s'; if (k === 'Enhancement') return '↑';
  const v = k in extra ? extra[k] : vals?.[k]; if (v == null) return '?';
  return fmt === 'ScalarPercent' ? `${Math.round(v * 100)}%` : typeof v === 'number' ? String(r1(v)) : String(v); });
// the short lines under each stat (base 0-100, then the enhanced 100-200 bonus) + the full text for hover / tap
function statLines(k, v, b, pieces) {
  const S = D?.stats; const f = S && Core.statAt(k, v, D); if (!f) return { lines: STAT_FX[k](v).filter(Boolean), tip: '' };
  const SLOT = { Grenade: 'grenade', Melee: 'melee', Class: 'classAbility', Super: 'super' }[k];
  const a = SLOT && subPick(b, SLOT, b.sub?.[SLOT]); const cd = a && Core.abilityCooldown(SLOT, a, v, b, D);
  const cdLine = cd ? `${a.n}: ${SLOT === 'super' ? '' : 'recharges in '}${cd.cd} s${SLOT === 'super' ? ' cooldown (the Super stat doesn’t change it)' : ` (base ${cd.base} s${cd.applied.length ? `, ${cd.applied.join(', ')}` : ''})`}${cd.src === 'compendium' ? ' · Compendium base' : ''}` : '';
  const E = v > 100; const L = [];
  if (k === 'Weapons') { L.push(`Reload ${r1(f.ReloadSpeed)}% and handling ${r1(f.Handling)}% faster; +${r1(f.NonBossDamageIncrease)}% weapon damage vs minor, elite and miniboss combatants`);
    if (E) L.push(`↑ +${r1(f.SpecialDamageIncrease)}% Special and +${r1(f.PowerDamageIncrease)}% Power weapon damage vs bosses, +${r1(f.PVPDamageIncrease)}% vs players, ${r1(f.LargeAmmoBrickChance)}% chance of Large Ammo Bricks`); }
  if (k === 'Health') { L.push(`Orbs of Power restore ${r1(f.OrbOfPowerHealthRestore)} HP; ${r1(f.FlinchResistance)}% flinch resistance while aiming`);

// phones: the item panel opens as a near full-height sheet that scrolls as one piece. Pulling down on the handle, or
// anywhere once the panel is scrolled to its top, follows the finger and closes it past a distance or with a flick;
// the pull never reaches the page, so it can't trigger the browser's pull-to-refresh. Listeners attach once.
function sheetDrag(d) {
  if (d.dataset.drag) return; d.dataset.drag = '1';
  let y0 = null, x0 = 0, t0 = 0, dy = 0, dragging = false, fromGrab = false;
  const pt = e => e.touches ? e.touches[0] : e;
  d.addEventListener('touchstart', e => {
    if (!isMobile() || !d.classList.contains('open') || e.target.closest('.gx,textarea,input,select')) { y0 = null; return; }
    y0 = pt(e).clientY; x0 = pt(e).clientX; t0 = performance.now(); dy = 0; dragging = false; fromGrab = !!e.target.closest('.grab');
  }, { passive: true });
  d.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = pt(e).clientY - y0; const dx = pt(e).clientX - x0;
    if (!dragging) {
      if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
      const top = (d.querySelector('.d-scroll')?.scrollTop || 0) <= 0;
      if (dy > 0 && Math.abs(dy) > Math.abs(dx) && (fromGrab || top)) { dragging = true; d.style.transition = 'none'; } else { y0 = null; return; }
    }
    e.preventDefault(); d.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });
  const end = () => {
    if (y0 == null) return; y0 = null; if (!dragging) return; dragging = false;
    const v = dy / Math.max(1, performance.now() - t0);
    d.style.transition = ''; d.style.transform = '';
    if (dy > 120 || (dy > 40 && v > 0.5)) closeDrawer();
  };
  d.addEventListener('touchend', end); d.addEventListener('touchcancel', end);
}
// long-press any perk / mod (touch) for its full description in a sheet
(() => {
  let t = null, x0 = 0, y0 = 0, fired = false;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return; const el = e.target.closest('[data-pk]'); if (!el) return;
    fired = false; x0 = e.clientX; y0 = e.clientY;
    const host = el.closest('[data-id]'); const ik = host ? S.byId.get(host.dataset.id)?.kind : (drawerItem?.kind);
    t = setTimeout(() => { fired = true; navigator.vibrate?.(15); modal(`<div class="pdet" style="margin:0">${infoHtml(el.dataset.pk, { ph: el.dataset.ph, sq: !!el.querySelector('.ic.sq'), ikind: ik })}</div><div style="text-align:right;margin-top:8px"><button class="btn" data-close>Close</button></div>`); }, 450);
  });
  const cancel = e => { if (t && (e.type !== 'pointermove' || Math.hypot(e.clientX - x0, e.clientY - y0) > 10)) { clearTimeout(t); t = null; } };
  ['pointerup', 'pointercancel', 'pointermove'].forEach(k => document.addEventListener(k, cancel));
  document.addEventListener('click', e => { if (fired) { fired = false; e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener('contextmenu', e => { if (e.target.closest('[data-pk]') && matchMedia('(pointer:coarse)').matches) e.preventDefault(); });
})();

const cleanKey = (it, k) => k === 'slot' ? (it.category || '—') : k === 'class' ? (it.equippable || '—') : k === 'tertiary' ? (it.tertiary || '—') : Core.groupKey(it, k) || '—';

function cleanGroups() {
  const st = CL.setup, kind = st.kind;
  let items = S.items.filter(i => i.kind === kind);
  if (st.filter.trim()) { const res = Core.runQuery(Core.parseQuery(st.filter), items, Core.buildCtx(S.items, new Set(pendingIds()), D)); items = items.filter(i => res.has(i.id)); }
  const keys = st.keys[kind]?.length ? st.keys[kind] : ['type'];
  const rank = st.rank[kind] || CLEAN_RANK[kind][0][0];
  const map = new Map();
  for (const it of items) {
    const ex = st.exoticsByName && /exotic/i.test(it.rarity);
    const parts = ex ? [it.name] : keys.map(k => cleanKey(it, k));
    const key = (ex ? 'Exotic · ' : '') + parts.join(' · ');
    if (!map.has(key)) map.set(key, { key, parts, ex, items: [] });
    map.get(key).items.push(it);
  }
  const groups = [...map.values()];
  for (const g of groups) {
    g.items.sort((a, b) => cleanRankVal(b, rank) - cleanRankVal(a, rank) || (b.crafted - a.crafted) || ((b.mwTier ?? 0) - (a.mwTier ?? 0)) || (b.power ?? 0) - (a.power ?? 0));
    let kept = 0;

      if (isProtected(it)) { g.sugg[it.id] = 'keep'; kept++; continue; }

}

// touch: drag a tile right to keep, left to trash
function swipeTile(t, decide) {
  let x0 = null, y0 = 0, dx = 0, horiz = null;
  t.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; horiz = null; t.style.transition = 'none'; }, { passive: true });
  t.addEventListener('touchmove', e => {
    if (x0 == null) return; dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (horiz == null && Math.hypot(dx, dy) > 8) horiz = Math.abs(dx) > Math.abs(dy);
    if (!horiz) return;
    t.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
    t.dataset.swipe = dx > 60 ? 'keep' : dx < -60 ? 'trash' : '';
  }, { passive: true });
  t.addEventListener('touchend', () => {
    if (x0 == null) return; x0 = null; t.style.transition = ''; t.style.transform = ''; const s = t.dataset.swipe; t.dataset.swipe = '';
    if (horiz && Math.abs(dx) > 90) decide(dx > 0 ? 'keep' : 'trash');
  });
}

      <button class="btn" data-close>Close</button></div>
    ${!installPrompt && !matchMedia('(display-mode: standalone)').matches ? '<p class="stat-pill">To add it to your home screen: iPhone Safari → Share → Add to Home Screen; Android Chrome → ⋮ → Install app. Works for a hosted copy of the app, not inside claude.ai.</p>' : ''}`);
  $('#mLoad').onclick = () => { closeModal(); openLoad(); };
  $('#mProf').onclick = () => openProfiles();
  $('#mHelp').onclick = () => { closeModal(); openHelp(); };
  $('#mRatings').onclick = () => { closeModal(); openRatings(); };
  $('#mAbout').onclick = () => { closeModal(); openAbout(); };
  const mb = $('#mBungie'); if (mb) mb.onclick = async () => { closeModal(); if (BG.signedIn()) loadFromBungie(); else { try { await flushSaves(); location.assign(BG.authorizeUrl()); } catch (e) { toast(e.message || 'Couldn’t start Bungie sign-in.', 6000); } } };
  const me = $('#mExport'); if (me) me.onclick = () => { closeModal(); exportCsv(); };
  const mi = $('#mInstall'); if (mi) mi.onclick = async () => { closeModal(); installPrompt.prompt(); try { await installPrompt.userChoice; } catch {} installPrompt = null; };
};
// offline cache / installability for hosted copies (not inside claude.ai, where service workers aren't available)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    // a home-screen copy can stay open for days: look for a new build whenever the app comes back to the front
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {}));
  // a new build took over while this page was open: offer a one-tap reload (saves are flushed first)
  let hadWorker = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadWorker) { hadWorker = true; return; }
    const t = $('#toast'); toast('Ghost was updated. Tap here to load the new version.', 20000);
    t.onclick = () => { t.onclick = null; flushSaves().catch(() => {}).finally(() => location.reload()); };
  });
}
// re-layout when crossing the phone breakpoint (rotation, resizing)
matchMedia('(max-width: 760px)').addEventListener?.('change', () => { if (VIEW === 'vault') renderPanes(); else setView(VIEW); });

renderAll();
loadAll().then(bungieReturn).finally(renderBungieBtn);
})();
</script>
</body>
</html>
